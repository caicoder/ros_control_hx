name: Flutter Windows Build

on:
  push:
    branches: [ main, master, t_project ]
  workflow_dispatch: # 支持手动点击触发

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 正确初始化 MSVC/Visual Studio 编译环境（vcvarsall）
      # 并设置 CMAKE_GENERATOR 指向 VS 2022
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4' # 匹配项目较新使用的版本
          channel: stable

      - name: Cache dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Check Visual Studio
        shell: pwsh
        run: |
          Write-Host "=== vswhere 检测 VS 实例 ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -products * -format json
          } else {
            Write-Host "vswhere not found"
          }
          Write-Host "=== CMake 版本 ==="
          cmake --version

      - name: Build Windows Release
        # 强制指定 CMake 使用 VS 2022，避免 Flutter 回退到默认的 VS 2019
        run: flutter build windows --release
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
          CMAKE_GENERATOR_PLATFORM: "x64"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
