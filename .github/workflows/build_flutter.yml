name: Flutter Windows Build

on:
  push:
    branches: [ main, master, t_project ]
  workflow_dispatch: # 支持手动点击触发

jobs:
  build_windows:
    # 使用 windows-2022 runner，它预装的是 Visual Studio 2022，
    # 而 windows-latest 自 2026-06 起预装 VS 2026，
    # 旧版 Flutter (3.24/3.27) 不支持 VS 2026，会回退到 VS 2019 导致报错。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # 正确初始化 MSVC/Visual Studio 2022 编译环境（vcvarsall）
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4' # 匹配项目较新使用的版本
          channel: stable

      - name: Cache dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
