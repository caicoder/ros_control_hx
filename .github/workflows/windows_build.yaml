name: Build Windows App

on:
  push:
    branches:
      - main
      - master
      - t_project
  pull_request:
    branches:
      - main
      - master
      - t_project
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Release (.exe)
    runs-on: windows-latest

    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.4'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Clean Stale CMake Cache
        shell: powershell
        run: |
          if (Test-Path "windows\flutter\ephemeral") { Remove-Item -Recurse -Force "windows\flutter\ephemeral" }
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload ZIP Release (Folder)
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-zip
          path: build/windows/x64/runner/Release/